<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="100%">
  <defs>
    <!-- Glassy blue for "vcf": bright top highlight into deep cyan -->
    <linearGradient id="vcfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="72%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <!-- Specular gloss overlay for "vcf" -->
    <linearGradient id="vcfGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Deep slate for "pro" -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="proGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Cloud body volume -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f6fc" />
      <stop offset="100%" stop-color="#dbe7f4" />
    </linearGradient>
    <radialGradient id="cloudGloss" cx="42%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloudShade" cx="55%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#a9c0da" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#a9c0da" stop-opacity="0" />
    </radialGradient>

    <!-- Circuit neon -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- 3D glass gem: hot specular core into deep navy rim -->
    <radialGradient id="gemGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0b2545" />
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#0b2545" flood-opacity="0.30" />
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <clipPath id="cloudClip">
      <path d="M 45,85 L 275,85 C 295,85 310,72 310,55 C 310,38 295,25 275,25 C 270,25 264,27 259,30 C 251,18 238,10 220,10 C 202,10 188,18 181,30 C 174,18 160,10 142,10 C 120,10 102,23 96,40 C 91,37 86,35 80,35 C 60,35 45,48 45,65 C 40,65 30,70 30,77 C 30,82 37,85 45,85 Z" />
    </clipPath>

    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      .gem-node { animation: pulse 2.8s infinite ease-in-out; }
      .circuit-track { stroke-dasharray: 9 6; animation: flow 3.6s infinite linear; }
      .gem-1 { animation-delay: 0s; }
      .gem-2 { animation-delay: 0.9s; }
      .gem-3 { animation-delay: 1.8s; }
      @media (prefers-reduced-motion: reduce) {
        .gem-node, .circuit-track { animation: none; }
      }
    </style>
  </defs>

  <!-- Subtle background circuit pathways -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 10 90 L 40 55 L 75 55" />
    <path d="M 25 95 L 45 70 L 80 70" />
  </g>

  <!-- Cloud base -->
  <path d="M 45,85 L 275,85 C 295,85 310,72 310,55 C 310,38 295,25 275,25 C 270,25 264,27 259,30 C 251,18 238,10 220,10 C 202,10 188,18 181,30 C 174,18 160,10 142,10 C 120,10 102,23 96,40 C 91,37 86,35 80,35 C 60,35 45,48 45,65 C 40,65 30,70 30,77 C 30,82 37,85 45,85 Z"
        fill="url(#cloudGrad)" stroke="#c4d4e6" stroke-width="1" filter="url(#dropShadow)" />

  <!-- Cloud volumetric shading (clipped to cloud) -->
  <g clip-path="url(#cloudClip)">
    <rect x="25" y="68" width="290" height="27" fill="url(#cloudShade)" />
    <ellipse cx="150" cy="18" rx="150" ry="42" fill="url(#cloudGloss)" />
  </g>

  <!-- Circuit tracks with bright cores -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path class="circuit-track" d="M 45,65 C 50,55 60,42 75,42 L 105,42" stroke="url(#circuitGrad)" stroke-width="3" />
    <path class="circuit-track" d="M 40,74 C 48,64 58,52 75,52 L 115,52" stroke="url(#circuitGrad)" stroke-width="2.5" />
    <path class="circuit-track" d="M 48,82 C 55,75 65,62 78,62 L 100,62" stroke="url(#circuitGrad)" stroke-width="2" />
    <path d="M 45,65 C 50,55 60,42 75,42 L 105,42" stroke="#e8fbff" stroke-width="1" opacity="0.9" />
    <path d="M 40,74 C 48,64 58,52 75,52 L 115,52" stroke="#e8fbff" stroke-width="0.9" opacity="0.85" />
    <path d="M 48,82 C 55,75 65,62 78,62 L 100,62" stroke="#e8fbff" stroke-width="0.8" opacity="0.8" />
  </g>

  <!-- Glowing glass gem terminals -->
  <g filter="url(#glow)">
    <g class="gem-node gem-1"><circle cx="105" cy="42" r="5" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.6" /><circle cx="103" cy="40" r="1.4" fill="#ffffff" opacity="0.9" /></g>
    <g class="gem-node gem-2"><circle cx="115" cy="52" r="5" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.6" /><circle cx="113" cy="50" r="1.4" fill="#ffffff" opacity="0.9" /></g>
    <g class="gem-node gem-3"><circle cx="100" cy="62" r="4.3" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.6" /><circle cx="98.5" cy="60.5" r="1.2" fill="#ffffff" opacity="0.9" /></g>
    <g class="gem-node gem-3"><circle cx="45" cy="65" r="3.6" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.5" /><circle cx="43.8" cy="63.8" r="1" fill="#ffffff" opacity="0.85" /></g>
    <g class="gem-node gem-1"><circle cx="40" cy="74" r="3.6" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.5" /><circle cx="38.8" cy="72.8" r="1" fill="#ffffff" opacity="0.85" /></g>
    <g class="gem-node gem-2"><circle cx="48" cy="82" r="3.1" fill="url(#gemGrad)" stroke="#bae6fd" stroke-width="0.5" /><circle cx="47" cy="81" r="0.9" fill="#ffffff" opacity="0.85" /></g>
  </g>

  <!-- Wordmark with glossy highlight overlay -->
  <g transform="translate(15, 0)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="40">
    <text x="110" y="66" letter-spacing="-1.5" fill="url(#vcfGrad)">vcf</text>
    <text x="110" y="66" letter-spacing="-1.5" fill="url(#vcfGloss)">vcf</text>
    <text x="172" y="66" letter-spacing="-1" fill="url(#proGrad)">pro</text>
    <text x="172" y="66" letter-spacing="-1" fill="url(#proGloss)">pro</text>
  </g>
</svg>
